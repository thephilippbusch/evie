$schema: 'https://moonrepo.dev/schemas/v2/workspace.json'

# Every folder in apps/ and libs/ is a project. The repository root is the
# `root` project, which hosts repo-wide tasks such as the commit hooks.
projects:
  globs:
    - 'apps/*'
    - 'libs/*'
  sources:
    root: '.'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
  # Hooks are generated into .moon/hooks and activated (core.hooksPath) on the
  # first moon run in a checkout, or with `moon sync hooks`.
  sync: true
  hooks:
    pre-commit:
      - 'moon run root:format-staged'
    commit-msg:
      - 'moon run root:lint-commit-msg -- "$ARG1"'
