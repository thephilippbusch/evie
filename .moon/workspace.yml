$schema: 'https://moonrepo.dev/schemas/v2/workspace.json'

# Every folder in apps/, libs/ and tools/ is a project. tools/ holds development
# tools, such as code generators, that never run in production: `layer: 'tool'`,
# or `layer: 'scaffolding'` for a generator that a library depends on. The repository root is the `root` project, which hosts repo-wide
# tasks such as the commit hooks.
projects:
  globs:
    - 'apps/*'
    - 'libs/*'
    - 'tools/*'
  sources:
    root: '.'

# Apps (`layer: 'application'`) may depend on libraries, but a library may never
# depend on an app. moon enforces this by default; it's set here so the rule is
# visible.
constraints:
  enforceLayerRelationships: true

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
  # Hooks are generated into .moon/hooks and activated (core.hooksPath) on the
  # first moon run in a checkout, or with `moon sync hooks`.
  sync: true
  hooks:
    pre-commit:
      - 'moon run root:format-staged'
    commit-msg:
      - 'moon run root:lint-commit-msg -- "$ARG1"'
