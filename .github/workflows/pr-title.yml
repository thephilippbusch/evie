name: PR title

# PRs are squash-merged and the squash commit takes the PR title, so the title
# is what release-please reads on main. `edited` re-runs the check when the
# title changes; the others keep the check on the PR's latest commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A newer run for the same PR replaces an older one, so a slow run for an old
# title can't report after the run for the current title.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    # The `main` ruleset requires this check by name.
    name: PR title
    runs-on: ubuntu-latest
    # A cold cache compiles evie-dev and its few dependencies first.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With no arguments, rustup installs the toolchain from
      # rust-toolchain.toml, the same one the hooks build with.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The title is untrusted input: pass it through the environment, never
      # interpolate it into the script, so it can't inject shell commands.
      # The same check runs in the commit-msg hook, so PR titles and local
      # commits follow the same rules.
      - name: Check that the PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | cargo run --locked --quiet -p evie-dev -- commit-msg --pr-title
