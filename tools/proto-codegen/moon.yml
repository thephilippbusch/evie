$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# A generator, not a plain tool: moon lets a library depend on the scaffolding
# layer but not on the tool layer, and libs/proto lists this project in dependsOn.
layer: 'scaffolding'
language: 'rust'
project:
  title: 'proto-codegen'
  description: 'Generates the Rust and TypeScript code in libs/proto from its protobuf definitions; run by the proto codegen tasks.'

# Projects this one uses, so affected checks reach their dependents.
dependsOn: []

# build, lint, check, test and format come from .moon/tasks/rust.yml.
tasks: {}
