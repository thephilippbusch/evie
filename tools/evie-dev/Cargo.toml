[package]
name = "evie-dev"
description = "Runs the repository's commit hooks, agent file check and Claude Code guardrails as one binary, so they need only the proto-pinned toolchain."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
yaml-rust2 = { version = "0.13.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
