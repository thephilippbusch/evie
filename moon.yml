$schema: 'https://moonrepo.dev/schemas/v2/project.json'

# The repository root as a project: hosts repo-wide tasks. Its tasks run from
# the repository root and never hash the whole repo. The hook and formatting
# tasks declare no inputs and are `run` tasks, so `moon check` and `moon ci`
# skip them; `validate-agent-files` is a `test` task that always runs in CI.
layer: 'tool'
project:
  title: 'root'
  description: 'Repo-wide tasks, such as the commit hooks and formatting.'

# Don't inherit the tasks meant for apps and libs.
workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    description: 'Format Markdown, JSON and YAML files with dprint.'
    command: 'dprint fmt'
    type: 'run'
    inputs: []
    options:
      cache: false
      runInCI: false

  format-staged:
    description: 'Format the staged files and stage the result. Run by the pre-commit hook.'
    command: 'sh scripts/format-staged.sh'
    type: 'run'
    inputs: []
    options:
      cache: false
      runInCI: false
      outputStyle: 'stream'

  lint-commit-msg:
    description: 'Check that a commit message is a Conventional Commit. Run by the commit-msg hook.'
    command: 'sh scripts/lint-commit-msg.sh'
    type: 'run'
    inputs: []
    options:
      cache: false
      runInCI: false
      outputStyle: 'stream'

  validate-agent-files:
    description: 'Validate skills, subagents and AGENTS.md files against the authoring-skills budgets.'
    command: 'sh scripts/validate-agent-files.sh'
    type: 'test'
    inputs:
      - '.agents/**/*'
      - '.claude/agents/**/*'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - 'scripts/validate-agent-files.sh'
    options:
      # Links may point to any file in the repo, which the inputs can't list
      # without hashing the whole repo. So the task never reuses a cached
      # result, and `moon ci` runs it even when no input changed.
      cache: false
      runInCI: 'always'
